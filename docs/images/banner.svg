<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E26"/>
      <stop offset="1" stop-color="#180A28"/>
    </linearGradient>
    <radialGradient id="b1"><stop offset="0" stop-color="#2864FF" stop-opacity=".75"/><stop offset="1" stop-color="#2864FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2"><stop offset="0" stop-color="#8C3CFA" stop-opacity=".7"/><stop offset="1" stop-color="#8C3CFA" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3"><stop offset="0" stop-color="#FF5AA0" stop-opacity=".55"/><stop offset="1" stop-color="#FF5AA0" stop-opacity="0"/></radialGradient>
    <radialGradient id="b4"><stop offset="0" stop-color="#00BEC8" stop-opacity=".55"/><stop offset="1" stop-color="#00BEC8" stop-opacity="0"/></radialGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4CC2FF"/>
      <stop offset="1" stop-color="#0067C0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".08"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="400" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <ellipse cx="380" cy="120" rx="520" ry="330" fill="url(#b1)"/>
    <ellipse cx="900" cy="260" rx="520" ry="330" fill="url(#b2)"/>
    <ellipse cx="820" cy="40" rx="360" ry="220" fill="url(#b3)"/>
    <ellipse cx="160" cy="400" rx="420" ry="260" fill="url(#b4)"/>
  </g>

  <!-- logo -->
  <g transform="translate(608 52)">
    <rect x="0" y="0" width="29" height="29" rx="5" fill="url(#logo)"/>
    <rect x="35" y="0" width="29" height="29" rx="5" fill="url(#logo)"/>
    <rect x="0" y="35" width="29" height="29" rx="5" fill="url(#logo)"/>
    <rect x="35" y="35" width="29" height="29" rx="5" fill="url(#logo)"/>
  </g>

  <text x="640" y="196" text-anchor="middle" fill="#FFFFFF"
        font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif"
        font-size="64" font-weight="600" letter-spacing="-1">Custom Start</text>
  <text x="640" y="238" text-anchor="middle" fill="#FFFFFF" fill-opacity=".72"
        font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif"
        font-size="22">A smooth, themeable command bar that replaces the Windows 11 Start menu</text>

  <!-- mini command bar -->
  <g transform="translate(330 280)">
    <rect width="620" height="56" rx="14" fill="#141428" fill-opacity=".35"/>
    <rect width="620" height="56" rx="14" fill="url(#glass)"/>
    <rect x=".5" y=".5" width="619" height="55" rx="13.5" fill="none" stroke="url(#edge)"/>
    <g transform="translate(20 19)">
      <rect x="0" y="0" width="8.2" height="8.2" rx="1.4" fill="url(#logo)"/>
      <rect x="9.8" y="0" width="8.2" height="8.2" rx="1.4" fill="url(#logo)"/>
      <rect x="0" y="9.8" width="8.2" height="8.2" rx="1.4" fill="url(#logo)"/>
      <rect x="9.8" y="9.8" width="8.2" height="8.2" rx="1.4" fill="url(#logo)"/>
    </g>
    <text x="54" y="34" fill="#FFFFFF" fill-opacity=".62"
          font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif"
          font-size="16">Search apps, or type &gt; for commands</text>
    <rect x="53" y="18" width="2" height="20" rx="1" fill="#60CDFF">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.55;.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
